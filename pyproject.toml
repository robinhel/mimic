[project]
name = "copycheck"
version = "0.1.0"
description = "Backtest av att kopiera Polymarket-traders på Kalshi. Bara läsning."
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "groq>=0.11"]

[project.scripts]
copycheck = "copycheck.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
